[package]
name = "package-installer"
version = "0.5.8"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/aelum-dev/package-installer"
description = "GTK4/libadwaita package manager for the Aelum desktop"

# The crate-version pins are the video-player's (same system libraries:
# gtk4 4.24 / libadwaita 1.10).

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["gnome_50"] }
libadwaita = { version = "0.9.2", features = ["v1_10", "gtk_v4_24"] }
tar = "0.4"
zstd = "0.13"
futures = "0.3"
flate2 = "1.1.10"
# i18n catalogs are flat JSON string maps — the player's pattern.
serde_json = "1"
