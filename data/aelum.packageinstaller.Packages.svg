      <stop offset="0.92" stop-color="#4a2a6e" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#4a2a6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="linear-gradient-1" x1="255.874" y1="141.34" x2="255.874" y2="431.916" gradientUnits="userSpaceOnUse">
