<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <!-- Download-box app icon, one of a two-icon set shared with the video
       player (same grid, same palette). 512 pt artboard, object centred on
       x = 256, baseline y = 416; one shared ground shadow. The lid overhangs
       the body, whose top corners are therefore square.
       Lid #c6a3d2 → #9e6ca6, body #7b4c86 → #45294f (the lid's cast shadow
       is extra stops in that ramp, not another object), seam #643e6f →
       #3a2145, glyph #ddcbe4 → #c6b0ce, tray #d9c6e2 at 82 %. Gradients
       only — no filters, no bitmap.
       Fills are the export's CSS classes; width/height are added so the file
       carries an intrinsic size like every other hicolor icon. -->
  <defs>
    <style>
      .cls-1{fill:url(#radial-gradient-1)}
      .cls-2{fill:url(#linear-gradient-1)}
      .cls-3{fill:url(#linear-gradient-2)}
      .cls-4{fill:url(#linear-gradient-3)}
      .cls-5{fill:#d9c6e2;opacity:0.82}
      .cls-6{fill:url(#linear-gradient-4)}
    </style>
    <radialGradient id="radial-gradient-1" cx="256" cy="416" r="175" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a2a6e" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#4a2a6e" stop-opacity="0.52"/>
      <stop offset="0.6" stop-color="#4a2a6e" stop-opacity="0.38"/>
      <stop offset="0.8" stop-color="#4a2a6e" stop-opacity="0.17"/>
      <stop offset="0.92" stop-color="#4a2a6e" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#4a2a6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="linear-gradient-1" x1="256" y1="167.5" x2="256" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a3765"/>
      <stop offset="0.02" stop-color="#623c6d"/>
      <stop offset="0.05" stop-color="#6b4276"/>
      <stop offset="0.09" stop-color="#73477e"/>
      <stop offset="0.14" stop-color="#73477e"/>
      <stop offset="0.2" stop-color="#70457b"/>
      <stop offset="0.28" stop-color="#6c4277"/>
      <stop offset="0.5" stop-color="#603a6a"/>
      <stop offset="1" stop-color="#45294f"/>
    </linearGradient>
    <linearGradient id="linear-gradient-2" x1="256" y1="167.5" x2="256" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4b2e55"/>
      <stop offset="0.02" stop-color="#51315b"/>
      <stop offset="0.05" stop-color="#583663"/>
      <stop offset="0.09" stop-color="#5e3a69"/>
      <stop offset="0.14" stop-color="#5e3a69"/>
      <stop offset="0.2" stop-color="#5c3867"/>
      <stop offset="0.28" stop-color="#583663"/>
      <stop offset="0.5" stop-color="#4f305a"/>
      <stop offset="1" stop-color="#3a2145"/>
    </linearGradient>
    <linearGradient id="linear-gradient-3" x1="256.107" y1="98.325" x2="256.107" y2="172.325" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c6a3d2"/>
      <stop offset="0.5" stop-color="#b288bc"/>
      <stop offset="1" stop-color="#9e6ca6"/>
    </linearGradient>
    <linearGradient id="linear-gradient-4" x1="256" y1="218.75" x2="256" y2="335.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ddcbe4"/>
      <stop offset="0.5" stop-color="#d2bed9"/>
      <stop offset="1" stop-color="#c6b0ce"/>
    </linearGradient>
  </defs>
  <title>download-box</title>
