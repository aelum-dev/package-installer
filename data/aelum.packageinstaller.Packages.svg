<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The glass package cube IS the icon; an install badge owns the corner.
       Dux Shell dark scheme (website base.css): accent #cfbdfe, deep purple #36275d.
       Sibling of the player icon: same light and palette, object-shaped silhouette. -->
  <defs>
    <linearGradient id="topF" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ece2ff"/>
      <stop offset="1" stop-color="#cfbdfe"/>
    </linearGradient>
    <linearGradient id="leftF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a98fdc"/>
      <stop offset="1" stop-color="#6f57ad"/>
    </linearGradient>
    <linearGradient id="rightF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4cae"/>
      <stop offset="1" stop-color="#38295e"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfbdfe"/>
      <stop offset="1" stop-color="#a894dd"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1c1430" flood-opacity="0.45"/>
    </filter>
    <filter id="badgeshadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1c1430" flood-opacity="0.4"/>
    </filter>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <ellipse cx="64" cy="110" rx="40" ry="11" fill="#7d5fc0" opacity="0.5" filter="url(#bloom)"/>
  <g filter="url(#drop)">
    <path d="M62 41.44 L95.12 58 L62 74.56 L28.88 58 Z" fill="url(#topF)"/>
    <path d="M28.88 58.92 L61.08 75.48 L61.08 103.08 L28.88 86.52 Z" fill="url(#leftF)"/>
    <path d="M95.12 58.92 L62.92 75.48 L62.92 103.08 L95.12 86.52 Z" fill="url(#rightF)"/>
  </g>
  <g filter="url(#badgeshadow)">
    <circle cx="98" cy="98" r="14" fill="url(#badge)"/>
    <rect x="89" y="95.8" width="18" height="4.4" rx="2.2" fill="#36275d"/>
    <rect x="95.8" y="89" width="4.4" height="18" rx="2.2" fill="#36275d"/>
  </g>
</svg>
