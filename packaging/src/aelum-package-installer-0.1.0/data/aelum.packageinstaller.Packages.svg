<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- App icon, the video-player's shape: a rounded squircle in the
       brand's dark base with the app's own glyph — a boxed package with
       its tape seam, drawn in the lighter brand pair so it reads on both
       light and dark launchers. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- box body -->
  <path d="M64 22 102 40v48L64 106 26 88V40Z" fill="#e0d8f0"/>
  <!-- top faces, the open-box read -->
  <path d="M64 22 102 40 64 58 26 40Z" fill="#f4effc"/>
  <!-- tape seam down the front -->
  <path d="M60 58h8v46a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2Z" fill="#8fff6a"/>
  <!-- side shading -->
  <path d="M64 58v48l38-18V40Z" fill="#d0c6e4" opacity=".55"/>
</svg>
